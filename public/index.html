<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tic-Tac-Toe</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container">
    <h1 class="title">TIC-TAC-TOE</h1>

    <div class="scoreboard" role="status" aria-label="Game score" aria-live="polite">
      <div class="score-item">
        <span class="score-label">WINS</span>
        <span class="score-value score-wins" id="score-wins">0</span>
      </div>
      <div class="score-item">
        <span class="score-label">LOSSES</span>
        <span class="score-value score-losses" id="score-losses">0</span>
      </div>
      <div class="score-item">
        <span class="score-label">DRAWS</span>
        <span class="score-value score-draws" id="score-draws">0</span>
      </div>
    </div>

    <div class="board" role="grid" aria-label="Tic-tac-toe board">
      <div role="row">
        <button class="cell" role="gridcell" aria-label="Row 1, Column 1, empty" data-row="0" data-col="0" tabindex="0"></button>
        <button class="cell" role="gridcell" aria-label="Row 1, Column 2, empty" data-row="0" data-col="1" tabindex="-1"></button>
        <button class="cell" role="gridcell" aria-label="Row 1, Column 3, empty" data-row="0" data-col="2" tabindex="-1"></button>
      </div>
      <div role="row">
        <button class="cell" role="gridcell" aria-label="Row 2, Column 1, empty" data-row="1" data-col="0" tabindex="-1"></button>
        <button class="cell" role="gridcell" aria-label="Row 2, Column 2, empty" data-row="1" data-col="1" tabindex="-1"></button>
        <button class="cell" role="gridcell" aria-label="Row 2, Column 3, empty" data-row="1" data-col="2" tabindex="-1"></button>
      </div>
      <div role="row">
        <button class="cell" role="gridcell" aria-label="Row 3, Column 1, empty" data-row="2" data-col="0" tabindex="-1"></button>
        <button class="cell" role="gridcell" aria-label="Row 3, Column 2, empty" data-row="2" data-col="1" tabindex="-1"></button>
        <button class="cell" role="gridcell" aria-label="Row 3, Column 3, empty" data-row="2" data-col="2" tabindex="-1"></button>
      </div>
    </div>

    <div class="status" role="status" aria-live="polite" aria-atomic="true">
      <span class="status-text">Your turn</span>
    </div>
  </main>

  <div class="result-overlay" role="dialog" aria-modal="true" aria-labelledby="result-heading" hidden>
    <div class="result-content">
      <h2 id="result-heading" class="result-title"></h2>
      <button class="btn-play-again">PLAY AGAIN</button>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
